[package]
name = "sample-creator-engine"
version = "0.3.1"
edition = "2024"
description = "Sample Creator core: recordings, waveform, playback, markup library, export and processing"
license = "MIT"
repository = "https://github.com/Horhik/sample-creator"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
nnnoiseless = { version = "0.5.2", default-features = false }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
realfft = "3.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
