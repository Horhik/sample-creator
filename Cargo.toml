[package]
name = "sample-creator"
version = "0.1.0"
edition = "2024"
description = "Mark up long field recordings and cut them into samples (GTK4)"
license = "MIT"
repository = "https://github.com/Horhik/sample-creator"

[workspace]
members = ["engine", "mobile/rust"]

[dependencies]
anyhow = "1.0.104"
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_48"] }
sample-creator-engine = { path = "engine" }

# DSP and peak scanning are unusable unoptimised; keep `cargo run` responsive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
