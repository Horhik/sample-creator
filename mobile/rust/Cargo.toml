[package]
name = "sample_creator_bridge"
version = "0.3.0"
edition = "2024"
description = "Sample Creator engine for the Flutter app (flutter_rust_bridge)"
license = "MIT"
repository = "https://github.com/Horhik/sample-creator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.12.0"
sample-creator-engine = { path = "../../engine" }

# cpal reaches Android audio through JNI and needs the app context first.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3.1"
ndk-context = "0.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
